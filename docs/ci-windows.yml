name: Build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 / Rust + C++
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Build native module
        run: ./build.ps1 -SkipRust
      - name: Build native regression tests
        run: |
          $targets = [regex]::Matches((Get-Content CMakeLists.txt -Raw), 'add_executable\((\w+_tests)\b') | ForEach-Object { $_.Groups[1].Value }
          if (-not $targets) { throw 'No native test targets found.' }
          cmake --build build/native --config Release --target $targets --parallel 6
          if ($LASTEXITCODE) { throw 'Native test build failed.' }
      - name: Run native regression tests
        run: ctest --test-dir build/native -C Release --output-on-failure
